<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Account | Rex & Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Shared site header -->
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark" aria-hidden="true">R</span>
                <span class="brand-name">
                    Rex <span class="amp">&amp;</span> Found
                </span>
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="search.html">Search posts</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="post.html">Make a Post</a>
            </nav>

            <div class="header-actions">
                <a class="login-link" href="login.html">
                    <span aria-hidden="true">&#9786;</span> Log in
                </a>
                <a class="btn btn-dark btn-sm" href="post.html">
                    + Post an item
                </a>
            </div>
        </div>
    </header>

    <main class="account-main">

        <div class="account-container">

            <!-- Profile information -->
            <section class="account-card">

                <div class="account-heading">
                    <img id="account-avatar" class="account-avatar"
                        src="https://vzzmpufeaceywcxcmwqu.supabase.co/storage/v1/object/public/post-images/rexandfoundlogo.png"
                        alt="Profile picture" referrerpolicy="no-referrer">

                    <div>
                        <p class="eyebrow">Your Rex & Found profile</p>
                        <h1 id="account-greeting">Welcome back!</h1>
                        <p id="account-email" class="account-email"></p>
                    </div>
                </div>

                <form id="profile-form">

                    <label for="display-name">Display Name</label>

                    <p class="field-description">
                        This is the name other people will see on your posts.
                    </p>

                    <input type="text" id="display-name" name="display-name" minlength="2" maxlength="30" required>

                    <p id="profile-message" class="profile-message" role="status"></p>

                    <button type="submit" class="btn btn-dark">
                        Save Changes
                    </button>

                </form>

                <div class="account-footer">
                    <button id="logout-button" class="btn btn-outline" type="button">
                        Sign Out
                    </button>
                </div>

            </section>

            <!-- Future post management -->
            <section class="account-card">

                <div class="section-head">
                    <div>
                        <p class="eyebrow">Your contributions</p>
                        <h2>My Posts</h2>
                    </div>

                    <a class="btn btn-orange" href="post.html">
                        + New Post
                    </a>
                </div>

                <div id="account-posts">
                    <p class="account-empty">
                        Your lost and found posts will appear here soon!
                    </p>
                </div>

            </section>

        </div>

    </main>

    <!-- Supabase and account scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/account.js"></script>

</body>

</html>
